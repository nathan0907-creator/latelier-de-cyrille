# Tient à jour l'adresse de démonstration du site sur GitHub Pages.
# Le vrai site est en ligne : chaque page de la démonstration renvoie à la même page du vrai site
# (« --live », ci-dessous). Sans cette adresse, la démonstration redevient une copie « pour de
# faux », refaite à chaque modification et chaque nuit.
name: Démonstration en ligne

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fabriquer la démonstration
        # --live : l'adresse du vrai site. À remplacer par le nom de domaine quand il sera branché.
        run: node scripts/export-demo.js _site --base=/${{ github.event.repository.name }} --origin=https://${{ github.repository_owner }}.github.io --live=https://latelier-de-cyrille.plantefevenathan.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
